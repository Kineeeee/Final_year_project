name: CI-CD 2 Service

on:
  push:
    branches: ["Online-version"]
  pull_request:
    branches: ["Online-version"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build web
        if: matrix.app == 'web'
        run: npm run build

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./apps/server
            dockerfile: ./apps/server/Dockerfile.prod
            image: phaser-snake-api
          - name: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
            image: phaser-snake-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SERVER_URL=${{ vars.GAME_PUBLIC_URL }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DEPLOY_ENV_PROD: ${{ secrets.DEPLOY_ENV_PROD }}
        run: |
          set -e
          missing=0

          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Missing required secret: DEPLOY_HOST"
            missing=1
          fi

          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::Missing required secret: DEPLOY_USER"
            missing=1
          fi

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Missing required secret: DEPLOY_SSH_KEY"
            missing=1
          fi

          if [ -z "$GHCR_PAT" ]; then
            echo "::error::Missing required secret: GHCR_PAT"
            missing=1
          fi

          if [ -z "$DEPLOY_ENV_PROD" ]; then
            echo "::error::Missing required secret: DEPLOY_ENV_PROD"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Deployment secrets validation failed"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENV_PROD: ${{ secrets.DEPLOY_ENV_PROD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_ENV_PROD
          script: |
            set -euo pipefail

            # 1) Create deploy directories
            sudo mkdir -p /opt/phaser-snake/deploy
            sudo chown -R "$USER:$USER" /opt/phaser-snake
            cd /opt/phaser-snake

            # 2) Fetch compose file from current workflow ref (works for private repos)
            curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${{ github.repository }}/contents/deploy/docker-compose.prod.yml?ref=${{ github.ref_name }}" \
              -o deploy/docker-compose.prod.yml

            # 3) Write runtime env from GitHub secret
            if [ -z "${DEPLOY_ENV_PROD:-}" ]; then
              echo "ERROR: DEPLOY_ENV_PROD is empty"
              exit 1
            fi

            umask 077
            printf '%s\n' "$DEPLOY_ENV_PROD" > deploy/.env.prod

            # 4) Login and deploy
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=latest
            export GHCR_OWNER=${{ github.repository_owner }}

            # Load runtime env for compose interpolation (portable across compose versions)
            set -a
            . deploy/.env.prod
            set +a

            compose() {
              if docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              elif command -v docker-compose >/dev/null 2>&1; then
                docker-compose "$@"
              else
                echo "ERROR: Neither 'docker compose' nor 'docker-compose' is available"
                exit 1
              fi
            }

            compose -f deploy/docker-compose.prod.yml pull
            compose -f deploy/docker-compose.prod.yml up -d --remove-orphans

            # 5) Print status so workflow log proves containers are running
            compose -f deploy/docker-compose.prod.yml ps
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

            # 6) Cleanup dangling images
            docker image prune -f
