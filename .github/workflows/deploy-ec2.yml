name: Build And Deploy To EC2

on:
  push:
    branches:
      - feature-test-cicd
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: phaser3-snake-api
  WEB_IMAGE: phaser3-snake-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.API_IMAGE }}:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_FACEBOOK_APP_ID=${{ secrets.VITE_FACEBOOK_APP_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.WEB_IMAGE }}:latest

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR }}"
            USER="${{ secrets.SSH_USER }}"

            # app dir (used later by deploy step)
            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER":"$USER" "$APP_DIR"
            sudo chmod -R u+rwX "$APP_DIR"

            # upload staging dir (this is the missing piece)
            mkdir -p "/home/${USER}/deploy_upload"
            chmod -R u+rwX "/home/${USER}/deploy_upload"

            ls -ld "$APP_DIR" "/home/${USER}/deploy_upload"

      - name: Validate deploy files exist
        run: |
          test -d apps/deploy
          ls -la apps/deploy
          # fail if no files to upload
          test -n "$(ls -A apps/deploy)"

      - name: Upload deploy config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "apps/deploy"
          target: "/home/${{ secrets.SSH_USER }}/deploy_upload"
          overwrite: true

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_DIR: ${{ secrets.APP_DIR }}
          GHCR_OWNER: ${{ env.OWNER_LC }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN,APP_DIR,GHCR_OWNER,IMAGE_TAG
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR }}"
            USER="${{ secrets.SSH_USER }}"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "${USER}":"${USER}" "$APP_DIR" || true

            # Move uploaded files into APP_DIR
            if [ -d "/home/${USER}/deploy_upload/apps/deploy" ]; then
              sudo mv -f "/home/${USER}/deploy_upload/apps/deploy/"* "$APP_DIR/" || true
            else
              sudo mv -f "/home/${USER}/deploy_upload/"* "$APP_DIR/" || true
            fi

            rm -rf "/home/${USER}/deploy_upload" || true

            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "Missing $APP_DIR/.env (copy from apps/deploy/.env.example and update values)."
              exit 1
            fi

            if [ ! -f api.env ]; then
              echo "Missing $APP_DIR/api.env (copy from apps/deploy/api.env.example and update values)."
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export GHCR_OWNER IMAGE_TAG

            docker compose -f compose.prod.yml --env-file .env pull
            docker compose -f compose.prod.yml --env-file .env up -d --remove-orphans

            docker image prune -af --filter "until=168h" || true
