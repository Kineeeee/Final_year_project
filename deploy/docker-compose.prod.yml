name: phaser-snake-prod

services:
  api:
    image: ghcr.io/${GHCR_OWNER}/phaser-snake-api:${IMAGE_TAG:-latest}
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
    networks:
      - phaser-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    networks:
      - phaser-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: ghcr.io/${GHCR_OWNER}/phaser-snake-web:${IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - phaser-net
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  phaser-net:
    driver: bridge
