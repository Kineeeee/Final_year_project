<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg" href="/file.svg" />
    <link rel="stylesheet" href="./src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, minimal-ui" />
    <title>Snake Game</title>
  </head>
  <body>
    <div id="game-container"></div>

    <!-- LOGIN FORM OVERLAY -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>SNAKE IO</h2>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" autocomplete="off">
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password">
            </div>

            <button id="btn-login">LOGIN</button>
            <button id="btn-register" class="secondary-btn">REGISTER</button>

            <!-- THÊM NÚT GUEST Ở ĐÂY -->
            <button id="btn-guest" class="guest-btn" style="background-color: #ff9800; margin-top: 10px;">PLAY AS GUEST</button>
            
            <p id="login-message"></p>
        </div>
    </div>


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
