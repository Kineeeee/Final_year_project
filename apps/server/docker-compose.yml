services:
  server:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT:-3000}
      - MONGO_URI=${MONGO_URI:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - LLM_API_KEY=${LLM_API_KEY:-replace_me}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-3-4b}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    # Load secrets from .env file
    env_file:
      - .env
    depends_on:
      # - mongo
      - redis
    restart: always
    # For Linux hosts, uncomment to let the container reach LM Studio on the host:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # mongo service removed (using Atlas)
  #   image: mongo:6.0
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db

  redis:
    image: redis:alpine
    # Avoid host port conflicts; only expose inside compose network.
    expose:
      - "6379"
    # If you need host access, change to "6380:6379" instead of 6379.
    restart: always

volumes:
  mongo-data:
