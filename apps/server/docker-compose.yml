services:
  server:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # - MONGO_URI=mongodb://mongo:27017/snakeGame
      - REDIS_URL=redis://redis:6379
    # Load secrets from .env file
    env_file:
      - .env
    depends_on:
      # - mongo
      - redis
    restart: always

  # mongo service removed (using Atlas)
  #   image: mongo:6.0
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db

  redis:
    image: redis:alpine
    # Avoid host port conflicts; only expose inside compose network.
    expose:
      - "6379"
    # If you need host access, change to "6380:6379" instead of 6379.
    restart: always

volumes:
  mongo-data:
