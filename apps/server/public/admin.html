<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Quiz Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }

        .card {
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .question-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .wrong-input {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="mb-4 text-center">Snake Quiz Management</h1>

        <div class="row">
            <!-- Add Question Form -->
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-primary text-white">Add New Question</div>
                    <div class="card-body">
                        <form id="addQuestionForm">
                            <div class="mb-3">
                                <label class="form-label">Topic</label>
                                <select class="form-select" id="topic" required>
                                    <option value="math">Math</option>
                                    <option value="english">English</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Difficulty</label>
                                <select class="form-select" id="difficulty">
                                    <option value="1">1 (8-9 years old)</option>
                                    <option value="2">2 (10-11 years old)</option>
                                    <option value="3">3 (12-13 years old)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Question Text</label>
                                <input type="text" class="form-control" id="questionText" required
                                    placeholder="e.g. 2 + 2 = ?">
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-success">Correct Answer</label>
                                <input type="text" class="form-control" id="correctAnswer" required
                                    placeholder="e.g. 4">
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-danger">Wrong Answers</label>
                                <div id="wrongAnswersContainer">
                                    <input type="text" class="form-control wrong-input" placeholder="Wrong 1" required>
                                    <input type="text" class="form-control wrong-input" placeholder="Wrong 2" required>
                                    <input type="text" class="form-control wrong-input" placeholder="Wrong 3" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Add Question</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Question List -->
            <div class="col-md-7">
                <div class="card">
                    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                        <span>Existing Questions</span>
                        <select class="form-select form-select-sm w-auto" id="filterTopic">
                            <option value="">All Topics</option>
                            <option value="math">Math</option>
                            <option value="english">English</option>
                        </select>
                    </div>
                    <div class="card-body question-list" id="questionList">
                        <!-- Loaded dynamically -->
                        <div class="text-center text-muted">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>

</html>
